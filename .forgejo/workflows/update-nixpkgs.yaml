name: Update Nixpkgs

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

jobs:
  update:
    runs-on: docker
    container:
      image: nixos/nix:latest

    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"

    steps:
      - name: Install required tools
        run: |
          nix profile add nixpkgs#nodejs nixpkgs#gnupg
          node --version
          git --version
          gpg --version

      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GPG signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          export GNUPGHOME="$HOME/.gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"

          printf '%s\n' "$GPG_PRIVATE_KEY" |
            gpg --batch --import

          printf '%s' "$GPG_PASSPHRASE" > "$GNUPGHOME/passphrase"
          chmod 600 "$GNUPGHOME/passphrase"

          cat > "$HOME/gpg-sign" <<'EOF'
          #!/bin/sh
          exec gpg --batch \
            --pinentry-mode loopback \
            --passphrase-file "$HOME/.gnupg/passphrase" \
            "$@"
          EOF
          chmod 700 "$HOME/gpg-sign"

          git config user.name "Lenn Steenbergen"
          git config user.email "ltjst@proton.me"
          git config user.signingkey D097C4C349922AC4
          git config commit.gpgsign true
          git config gpg.program "$HOME/gpg-sign"

          gpg --batch --list-secret-keys D097C4C349922AC4

      - name: Update flake inputs
        run: nix flake update

      - name: Commit and verify update
        run: |
          set -eu

          if git diff --quiet -- flake.lock; then
            echo "No flake updates available."
            exit 0
          fi

          git add flake.lock
          git commit -S -m "chore: update flake inputs"
          git verify-commit HEAD

      - name: Push update
        run: git push