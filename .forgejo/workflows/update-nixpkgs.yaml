
name: Update Nixpkgs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: docker
    container:
      image: nixos/nix:latest

    steps:
      - name: Install Git
        run: |
          nix-env -iA nixpkgs.git

      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update flake inputs
        run: nix flake update
