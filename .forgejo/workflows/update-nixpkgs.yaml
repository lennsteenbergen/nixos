
name: Update Nixpkgs

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

jobs:
  update:
    runs-on: docker
    container:
      image: nixos/nix:latest
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update flake inputs
        run: nix flake update
